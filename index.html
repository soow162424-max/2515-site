<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Server 2515</title>

<style>
body {
  margin:0;
  font-family: Arial;
  background: radial-gradient(circle at top, #0b1a24, #02070b);
  color:white;
  text-align:center;
}

.snow {
  position:fixed;
  width:100%;
  height:100%;
  background-image: radial-gradient(white 1px, transparent 1px);
  background-size:20px 20px;
  animation:snow 20s linear infinite;
  opacity:0.3;
}

@keyframes snow {
  from { transform: translateY(-100px); }
  to { transform: translateY(100vh); }
}

.container {
  margin-top:120px;
}

h1 {
  font-size:50px;
  text-shadow:0 0 15px #00ccff;
}

.btn {
  display:block;
  width:250px;
  margin:15px auto;
  padding:15px;
  border-radius:12px;
  background:rgba(0,153,204,0.3);
  color:white;
  text-decoration:none;
}

.btn:hover {
  background:#00ccff;
}
</style>
</head>

<body>

<div class="snow"></div>

<div class="container">
  <h1>🔥 SERVER 2515 🔥</h1>
  <p>화이트아웃 서바이벌</p>

  <a class="btn" href="#">🎮 게임 입장</a>
  <a class="btn" href="#">💬 디스코드</a>
  <a class="btn" href="#">📢 공지</a>
</div>

</body>
</html>
